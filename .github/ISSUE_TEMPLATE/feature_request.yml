name: 功能建议 / Feature request
description: 描述希望解决的使用问题 / Describe a workflow you want to improve
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Workflow and problem
      description: 目前哪一步不方便？ / Which part of the current workflow is difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为 / Proposed behavior
      description: 描述具体操作和结果，可附示意图。 / Describe the interaction and result; mockups are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方案 / Alternatives tried
  - type: textarea
    id: context
    attributes:
      label: 补充说明 / Additional context
      description: 请先移除图片中的私人信息。 / Remove private information from images.
